<div class="modal-header border-0 pb-0">
  <div>
    <h5 class="modal-title mb-1">Payment Documentary</h5>
    <p class="text-muted small mb-0">{{ project.name }}</p>
  </div>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body pt-2">
  <app-project-payment-section [project]="project" [editable]="editable" [embedded]="true" />
</div>

<div class="modal-footer border-0 pt-0">
  <button type="button" class="btn btn-light" (click)="activeModal.dismiss()">Close</button>
</div>
