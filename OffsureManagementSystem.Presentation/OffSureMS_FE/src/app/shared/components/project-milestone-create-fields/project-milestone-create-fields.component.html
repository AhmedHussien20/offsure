@if (isFixedBudget) {
  <div
    class="milestone-create-fields"
    [class.milestone-create-fields--embedded]="embedded()"
    [formGroup]="form">
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        [id]="idPrefix + '-usesMilestones'"
        formControlName="usesMilestones" />
      <label class="form-check-label" [for]="idPrefix + '-usesMilestones'">
        Split budget into milestones
      </label>
    </div>
    <p class="milestone-create-fields__hint">
      Leave off for a single-phase project. When enabled, define phases on the project Milestones tab.
    </p>

    @if (usesMilestones) {
      <label class="milestone-create-fields__label" [for]="idPrefix + '-milestoneCount'">Number of milestones</label>
      <input
        type="number"
        class="form-control milestone-create-fields__count"
        [id]="idPrefix + '-milestoneCount'"
        formControlName="milestoneCount"
        [min]="minCount"
        [max]="maxCount"
        step="1"
        placeholder="e.g. 3" />
      <p class="milestone-create-fields__hint mb-0">Between {{ minCount }} and {{ maxCount }} phases.</p>
    }
  </div>
}
