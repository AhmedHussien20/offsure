@if (isFixedBudget) {
  <div class="milestone-create-fields" [formGroup]="form">
    <div class="form-check form-switch mb-2">
      <input
        class="form-check-input"
        type="checkbox"
        [id]="idPrefix + '-usesMilestones'"
        formControlName="usesMilestones" />
      <label class="form-check-label" [for]="idPrefix + '-usesMilestones'">
        Split budget into milestones (phases)
      </label>
    </div>
    <p class="text-muted small mb-2">
      Leave off for a single-phase project. When enabled, set how many phases you will define on the project Milestones tab.
    </p>

    @if (usesMilestones) {
      <label class="form-label small fw-semibold" [for]="idPrefix + '-milestoneCount'">Number of milestones</label>
      <input
        type="number"
        class="form-control form-control-sm milestone-create-fields__count"
        [id]="idPrefix + '-milestoneCount'"
        formControlName="milestoneCount"
        [min]="minCount"
        [max]="maxCount"
        step="1"
        placeholder="e.g. 3" />
      <p class="text-muted small mb-0 mt-1">Between {{ minCount }} and {{ maxCount }} phases.</p>
    }
  </div>
}
