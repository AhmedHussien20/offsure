@if (loading) {
  <div class="text-center py-5 text-muted">Loading profile...</div>
} @else if (!profile) {
  <div class="alert alert-warning">Profile not found.</div>
} @else {
  <div class="account-profile">
    <section class="card custom-card profile-header-card mb-4">
      <div class="profile-header-cover"></div>
      <div class="profile-header-body">
        <div class="profile-header-main">
          <span class="profile-avatar-readonly">{{ initials }}</span>
          <div class="profile-header-info">
            <h2 class="profile-header-name mb-1">{{ displayName }}</h2>
            <p class="profile-header-title mb-2">{{ profile.email }}</p>
            <div class="profile-header-meta">
              <span class="profile-meta-item">
                <span class="badge bg-primary-transparent">{{ roleLabel }}</span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card custom-card profile-tabs-card">
      <ul ngbNav #profileNav="ngbNav" [(activeId)]="activeTab" class="nav profile-tabs">
        <li [ngbNavItem]="'personal'">
          <a ngbNavLink class="nav-link">Personal info</a>
          <ng-template ngbNavContent>
            <div class="profile-tab-content">
              <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">{{ 'ACCOUNT.FIRST_NAME' | translate }}</label>
                    <input type="text" class="form-control" formControlName="firstName" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">{{ 'ACCOUNT.LAST_NAME' | translate }}</label>
                    <input type="text" class="form-control" formControlName="lastName" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">{{ 'ACCOUNT.EMAIL' | translate }}</label>
                    <input type="email" class="form-control" [value]="profile.email" readonly disabled />
                    <small class="text-muted">{{ 'ACCOUNT.EMAIL_READONLY' | translate }}</small>
                  </div>
                </div>
                <div class="profile-form-actions">
                  <button type="submit" class="btn btn-primary btn-sm px-4" [disabled]="saving">
                    {{ saving ? ('ACCOUNT.SAVING' | translate) : ('ACCOUNT.SAVE_CHANGES' | translate) }}
                  </button>
                </div>
              </form>

              <app-change-password-card [embedded]="true"></app-change-password-card>
            </div>
          </ng-template>
        </li>
      </ul>

      <div class="profile-tabs__outlet" [ngbNavOutlet]="profileNav"></div>
    </section>
  </div>
}
