<app-page-header></app-page-header>

<div class="card custom-card client-team-members">
  <div class="card-body">
    <div class="client-team-members__toolbar row g-3 align-items-end">
      <div class="col-lg-3 col-md-6">
        <label class="form-label mb-1" for="nameSearch">Search by name</label>
        <div class="client-team-members__search">
          <i class="fe fe-user client-team-members__search-icon"></i>
          <input
            id="nameSearch"
            type="text"
            class="form-control client-team-members__search-input"
            placeholder="Team member name"
            [(ngModel)]="nameSearch"
            (ngModelChange)="onNameSearchInput()" />
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label mb-1" for="skillSearch">Search by skill</label>
        <div class="client-team-members__search">
          <i class="fe fe-search client-team-members__search-icon"></i>
          <input
            id="skillSearch"
            type="text"
            class="form-control client-team-members__search-input"
            placeholder="e.g. Angular, .NET, DevOps"
            [(ngModel)]="skillSearch"
            (ngModelChange)="onSkillSearchInput()" />
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <app-toolbar-select
          inputId="experienceBand"
          label="Experience"
          [options]="experienceOptions"
          [(ngModel)]="experienceBand"
          (selectionChange)="onExperienceBandChange()" />
      </div>

      <div class="col-lg-3 col-md-6">
        <app-toolbar-select
          inputId="projectFilter"
          label="My project"
          nullOptionLabel="All members"
          [searchable]="true"
          [pageSize]="20"
          [loadPage]="loadProjectsPage"
          [(ngModel)]="projectId"
          (selectionChange)="onProjectChange()" />
      </div>
    </div>

    <div
      class="client-team-members__results"
      [class.client-team-members__results--initial]="!hasLoadedOnce && loading">
      @if (hasLoadedOnce && members.length === 0) {
        <div class="client-team-members__empty text-center py-5">
          <i class="ti ti-users client-team-members__empty-icon"></i>
          <h5 class="mt-3 mb-1">No team members found</h5>
          <p class="text-muted mb-0">Try adjusting your search or filters.</p>
        </div>
      } @else {
        <div class="client-team-members__grid">
          @for (member of members; track member.id) {
          <button type="button" class="client-member-card" (click)="openMemberDetail(member)">
            @if (photoUrl(member)) {
              <img [src]="photoUrl(member)!" [alt]="member.fullName" class="client-member-card__photo" />
            } @else {
              <span class="client-member-card__avatar">{{ initials(member) }}</span>
            }
            <div class="client-member-card__body">
              <p class="client-member-card__name mb-0">{{ member.fullName }}</p>
              <p class="client-member-card__meta mb-1">{{ member.title || 'Team member' }}</p>
              <p class="client-member-card__years mb-2">{{ member.yearsOfExperience }} years experience</p>
              @if (member.skills.length) {
                <div class="client-member-card__tags mb-2">
                  @for (skill of member.skills.slice(0, 4); track skill) {
                    <span class="badge bg-light text-dark">{{ skill }}</span>
                  }
                </div>
              }
            </div>
          </button>
        }
      </div>

      @if (showPagination) {
        <div class="d-flex justify-content-center mt-4 pt-3 border-top">
          <ngb-pagination
            [collectionSize]="totalCount"
            [(page)]="page"
            [pageSize]="pageSize"
            [maxSize]="5"
            [boundaryLinks]="true"
            (pageChange)="onPageChange($event)">
          </ngb-pagination>
        </div>
      }
      }
    </div>
  </div>
</div>
