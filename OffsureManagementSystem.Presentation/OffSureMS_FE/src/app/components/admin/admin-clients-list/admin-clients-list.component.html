<app-page-header></app-page-header>

<div class="card custom-card">
    <app-generic-table
      [columns]="columns"
      [data]="data"
      [page]="page"
      [entries]="entries"
      [totalItems]="totalItems"
      [totalPages]="totalPages"
      [searchCriteria]="searchCriteria"
      [labels]="labels"
      [dropdownOptions]="dropdownOptions"
      [showFilters]="true"
      [showPagination]="true"
      [showEmployeeFilter]="false"
      [showExportExcel]="false"
      [showAddButton]="true"
      [addButtonLabel]="'Add Client'"
      [expandable]="true"
      [expandTemplate]="clientDetail"
      [onSearch]="onSearch"
      (pageChange)="onPageChange($event)"
      (entriesChange)="onEntriesChange($event)"
      (addClick)="onAdd()">
    </app-generic-table>
</div>

<ng-template #clientDetail let-item>
  <app-admin-client-detail-panel
    [clientId]="item.id"
    (saved)="onClientSaved()" />
</ng-template>
