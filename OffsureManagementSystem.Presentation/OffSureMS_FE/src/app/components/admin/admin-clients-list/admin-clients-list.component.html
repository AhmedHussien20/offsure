<app-page-header
  [title]="'Clients'"
  [title1]="['Admin', 'Clients']"
  [activeitem]="'Clients'">
</app-page-header>

<div class="card custom-card">
    <app-generic-table
      [columns]="columns"
      [data]="data"
      [page]="page"
      [entries]="entries"
      [totalItems]="totalItems"
      [totalPages]="totalPages"
      [searchCriteria]="searchCriteria"
      [showFilters]="true"
      [showPagination]="true"
      [showEmployeeFilter]="false"
      [showExportExcel]="false"
      [showAddButton]="false"
      [onSearch]="onSearch"
      (pageChange)="onPageChange($event)"
      (entriesChange)="onEntriesChange($event)">
    </app-generic-table>
</div>
