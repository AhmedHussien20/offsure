<app-page-header></app-page-header>

<div class="card custom-card">
  <app-generic-table
    [columns]="columns"
    [data]="data"
    [page]="page"
    [entries]="entries"
    [totalItems]="totalItems"
    [totalPages]="totalPages"
    [searchCriteria]="searchCriteria"
    [labels]="labels"
    [dropdownOptions]="dropdownOptions"
    [showFilters]="true"
    [showPagination]="true"
    [showEmployeeFilter]="false"
    [showExportExcel]="false"
    [showAddButton]="true"
    [addButtonLabel]="'Add member'"
    [expandable]="true"
    [expandTemplate]="memberDetail"
    [expandedRowId]="expandedRowId"
    [onSearch]="onSearch"
    (addClick)="onAdd()"
    (pageChange)="onPageChange($event)"
    (entriesChange)="onEntriesChange($event)"
    (expandedRowChange)="onExpandedRowChange($event)">
  </app-generic-table>
</div>

<ng-template #memberDetail let-item>
  <app-admin-client-detail-panel
    [clientId]="item.id"
    (saved)="onMemberSaved()"
    (deleted)="onMemberDeleted()" />
</ng-template>
