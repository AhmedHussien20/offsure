<app-page-header></app-page-header>

<ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav nav-tabs nav-style-5 mb-3">
  <li [ngbNavItem]="'categories'">
    <a ngbNavLink class="nav-link">Skill Categories</a>
    <ng-template ngbNavContent>
      <div class="card custom-card">
        <app-generic-table
          [columns]="categoryColumns"
          [data]="categories"
          [page]="catPage"
          [entries]="catEntries"
          [totalItems]="catTotal"
          [totalPages]="catTotalPages"
          [searchCriteria]="catSearch"
          [showFilters]="true"
          [showPagination]="true"
          [showEmployeeFilter]="false"
          [showExportExcel]="false"
          [showAddButton]="true"
          [addButtonLabel]="'Add Category'"
          [expandable]="true"
          [expandTemplate]="categoryActions"
          [onSearch]="onCatSearch"
          (pageChange)="onCatPageChange($event)"
          (entriesChange)="onCatEntriesChange($event)"
          (addClick)="openCategoryForm()">
        </app-generic-table>
      </div>
    </ng-template>
  </li>

  <li [ngbNavItem]="'skills'">
    <a ngbNavLink class="nav-link">Skills</a>
    <ng-template ngbNavContent>
      <div class="card custom-card">
        <app-generic-table
          [columns]="skillColumns"
          [data]="skills"
          [page]="skillPage"
          [entries]="skillEntries"
          [totalItems]="skillTotal"
          [totalPages]="skillTotalPages"
          [searchCriteria]="skillSearch"
          [labels]="skillLabels"
          [dropdownOptions]="skillDropdownOptions"
          [showFilters]="true"
          [showPagination]="true"
          [showEmployeeFilter]="false"
          [showExportExcel]="false"
          [showAddButton]="true"
          [addButtonLabel]="'Add Skill'"
          [expandable]="true"
          [expandTemplate]="skillActions"
          [onSearch]="onSkillSearch"
          (pageChange)="onSkillPageChange($event)"
          (entriesChange)="onSkillEntriesChange($event)"
          (addClick)="openSkillForm()">
        </app-generic-table>
      </div>
    </ng-template>
  </li>
</ul>
<div [ngbNavOutlet]="nav"></div>

<ng-template #categoryActions let-item>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <span class="text-muted small">Inactive categories are hidden from team skill lists.</span>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-outline-success]="!item.isActive"
      [class.btn-outline-secondary]="item.isActive"
      (click)="toggleCategoryActive(item)">
      {{ item.isActive ? 'Deactivate' : 'Activate' }}
    </button>
  </div>
</ng-template>

<ng-template #skillActions let-item>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <span class="text-muted small">Inactive skills cannot be assigned to team members.</span>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-outline-success]="!item.isActive"
      [class.btn-outline-secondary]="item.isActive"
      (click)="toggleSkillActive(item)">
      {{ item.isActive ? 'Deactivate' : 'Activate' }}
    </button>
  </div>
</ng-template>
