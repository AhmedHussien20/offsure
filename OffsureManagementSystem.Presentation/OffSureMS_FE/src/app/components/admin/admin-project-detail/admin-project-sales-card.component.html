<button
  type="button"
  class="project-detail-stat project-detail-stat--action"
  (click)="openModal()">
  <span class="project-detail-stat__label">Sales</span>
  <span class="project-detail-stat__value">{{ salesValueLabel }}</span>
  <span class="project-detail-stat__hint project-detail-stat__hint--action">{{ salesHintLabel }}</span>
  <i class="fe fe-arrow-right project-detail-stat__arrow" aria-hidden="true"></i>
</button>
