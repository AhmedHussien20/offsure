<div class="modal-header">
  <div>
    <h5 class="modal-title mb-1">Edit project</h5>
    <p class="text-muted small mb-0">Update basic project information.</p>
  </div>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" class="generic-form">
    <app-generic-form [formGroup]="form" [formConfig]="formConfig" [showSubmit]="false"></app-generic-form>

    @if (isHourlyBudget) {
      <div class="mb-0">
        <label class="form-label fw-semibold" for="edit-hourly-rate">Hourly billing rate</label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input
            id="edit-hourly-rate"
            type="number"
            class="form-control"
            formControlName="hourlyRate"
            min="0.01"
            step="0.01" />
          <span class="input-group-text">/hr</span>
        </div>
      </div>
    } @else {
      <div class="mb-0">
        <label class="form-label fw-semibold" for="edit-budget">Budget</label>
        <input
          id="edit-budget"
          type="number"
          class="form-control"
          formControlName="budget"
          min="0"
          step="0.01" />
      </div>
    }
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light" [disabled]="saving" (click)="activeModal.dismiss()">Cancel</button>
  <button type="button" class="btn btn-primary" [disabled]="saving || form.invalid" (click)="save()">
    {{ saving ? 'Saving...' : 'Save changes' }}
  </button>
</div>
