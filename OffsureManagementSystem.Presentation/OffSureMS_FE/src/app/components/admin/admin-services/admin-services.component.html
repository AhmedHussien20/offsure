<app-page-header></app-page-header>

<ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav nav-tabs nav-style-5 mb-3">
  <li [ngbNavItem]="'categories'">
    <a ngbNavLink class="nav-link">Service Categories</a>
    <ng-template ngbNavContent>
      <div class="card custom-card">
        <app-generic-table
          [columns]="categoryColumns"
          [data]="categories"
          [page]="catPage"
          [entries]="catEntries"
          [totalItems]="catTotal"
          [totalPages]="catTotalPages"
          [searchCriteria]="catSearch"
          [labels]="catLabels"
          [dropdownOptions]="catDropdownOptions"
          [showFilters]="true"
          [showPagination]="true"
          [showEmployeeFilter]="false"
          [showExportExcel]="false"
          [showAddButton]="true"
          [addButtonLabel]="'Add Category'"
          [expandable]="true"
          [expandTemplate]="categoryActions"
          [onSearch]="onCatSearch"
          (pageChange)="onCatPageChange($event)"
          (entriesChange)="onCatEntriesChange($event)"
          (addClick)="openCategoryForm()">
        </app-generic-table>
      </div>
    </ng-template>
  </li>
  <li [ngbNavItem]="'services'">
    <a ngbNavLink class="nav-link">Services</a>
    <ng-template ngbNavContent>
      <div class="card custom-card">
        <app-generic-table
          [columns]="serviceColumns"
          [data]="services"
          [page]="svcPage"
          [entries]="svcEntries"
          [totalItems]="svcTotal"
          [totalPages]="svcTotalPages"
          [searchCriteria]="svcSearch"
          [labels]="svcLabels"
          [dropdownOptions]="svcDropdownOptions"
          [showFilters]="true"
          [showPagination]="true"
          [showEmployeeFilter]="false"
          [showExportExcel]="false"
          [showAddButton]="true"
          [addButtonLabel]="'Add Service'"
          [expandable]="true"
          [expandTemplate]="serviceActions"
          [onSearch]="onSvcSearch"
          (pageChange)="onSvcPageChange($event)"
          (entriesChange)="onSvcEntriesChange($event)"
          (addClick)="openServiceForm()">
        </app-generic-table>
      </div>
    </ng-template>
  </li>
</ul>
<div [ngbNavOutlet]="nav"></div>

<ng-template #categoryActions let-item>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <span class="text-muted small">Inactive categories are hidden from the public landing page.</span>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-outline-success]="!item.isActive"
      [class.btn-outline-secondary]="item.isActive"
      (click)="toggleCategoryActive(item)">
      {{ item.isActive ? 'Deactivate' : 'Activate' }}
    </button>
  </div>
</ng-template>

<ng-template #serviceActions let-item>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <span class="text-muted small">Control visibility on the public landing page.</span>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-outline-success]="!item.isVisible"
      [class.btn-outline-warning]="item.isVisible"
      (click)="toggleVisibility(item)">
      {{ item.isVisible ? 'Hide from landing' : 'Show on landing' }}
    </button>
  </div>
</ng-template>
