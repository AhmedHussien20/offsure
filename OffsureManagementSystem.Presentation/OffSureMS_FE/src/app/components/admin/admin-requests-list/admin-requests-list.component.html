<app-page-header></app-page-header>

<div class="card custom-card">
    <app-generic-table
      [columns]="columns"
      [data]="data"
      [page]="page"
      [entries]="entries"
      [totalItems]="totalItems"
      [totalPages]="totalPages"
      [searchCriteria]="searchCriteria"
      [labels]="labels"
      [dropdownOptions]="dropdownOptions"
      [showFilters]="true"
      [showPagination]="true"
      [showEmployeeFilter]="false"
      [showExportExcel]="false"
      [showAddButton]="false"
      [expandable]="true"
      [expandTemplate]="requestActions"
      [onSearch]="onSearch"
      (pageChange)="onPageChange($event)"
      (entriesChange)="onEntriesChange($event)">
    </app-generic-table>
</div>

<ng-template #requestActions let-item>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <label class="mb-0 me-1 fw-semibold">Status:</label>
    <select
      class="form-select form-select-sm w-auto"
      [ngModel]="item.status"
      [disabled]="isStatusChangeDisabled(item)"
      (ngModelChange)="updateStatus(item, $event)">
      @for (s of statusOptionsFor(item); track s) {
        <option [ngValue]="s">{{ s === 'InProgress' ? 'In Progress' : (s === 'Cancelled' ? 'Cancelled' : s) }}</option>
      }
    </select>
    @if (canShowConvertToProject(item)) {
      <button
        type="button"
        class="btn btn-sm btn-primary"
        [disabled]="item.status !== 'InProgress'"
        (click)="convertToProject(item)">
        Convert to Project
      </button>
      <small class="text-muted">Set status to In Progress, then convert to a project.</small>
    } @else if (!canCompleteRequest(item)) {
      <small class="text-warning w-100">
        Finish the project (mark it Completed) before completing this request.
        <a [routerLink]="['/admin/projects', item.projectId]" class="ms-1">Open project</a>
      </small>
    } @else {
      <a [routerLink]="['/admin/projects', item.projectId]" class="btn btn-sm btn-outline-primary">
        Open project
      </a>
    }
  </div>
</ng-template>
