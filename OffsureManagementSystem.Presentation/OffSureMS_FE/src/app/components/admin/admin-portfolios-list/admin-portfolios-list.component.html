<app-page-header
  [title]="'Portfolio'"
  [title1]="['Admin', 'Portfolio']"
  [activeitem]="'Portfolio'">
</app-page-header>

<div class="card custom-card">
  <div class="card-body">
    <app-generic-table
      [title]="'Portfolio Items'"
      [columns]="columns"
      [data]="data"
      [page]="page"
      [entries]="entries"
      [totalItems]="totalItems"
      [totalPages]="totalPages"
      [searchCriteria]="searchCriteria"
      [showFilters]="true"
      [showPagination]="true"
      [showEmployeeFilter]="false"
      [showExportExcel]="false"
      [showAddButton]="false"
      [onSearch]="onSearch"
      (pageChange)="onPageChange($event)"
      (entriesChange)="onEntriesChange($event)">
    </app-generic-table>
    <p class="text-muted small mt-2 mb-0">Add and edit portfolio forms can be added in a follow-up step.</p>
  </div>
</div>
