<app-page-header
  [title]="'Portfolio'"
  [title1]="['Admin', 'Portfolio']"
  [activeitem]="'Portfolio'">
</app-page-header>

@if (showForm) {
  <div class="card custom-card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Add Portfolio Project</h5>
      <button type="button" class="btn btn-sm btn-light" (click)="cancelForm()">Cancel</button>
    </div>
    <div class="card-body">
      @if (serviceOptions.length === 0) {
        <div class="alert alert-warning mb-3">
          Create at least one service before adding portfolio projects.
        </div>
      }
      <app-generic-form
        [formGroup]="portfolioForm"
        [formConfig]="formConfig"
        [showSubmit]="false">
      </app-generic-form>
      <button
        type="button"
        class="btn btn-primary btn-sm"
        [disabled]="saving || serviceOptions.length === 0"
        (click)="submitPortfolio()">
        Save Portfolio
      </button>
    </div>
  </div>
}

<div class="card custom-card">
  <app-generic-table
    [columns]="columns"
    [data]="data"
    [page]="page"
    [entries]="entries"
    [totalItems]="totalItems"
    [totalPages]="totalPages"
    [searchCriteria]="searchCriteria"
    [showFilters]="true"
    [showPagination]="true"
    [showEmployeeFilter]="false"
    [showExportExcel]="false"
    [showAddButton]="true"
    [addButtonLabel]="'Add Portfolio'"
    [expandable]="true"
    [expandTemplate]="portfolioActions"
    [onSearch]="onSearch"
    (pageChange)="onPageChange($event)"
    (entriesChange)="onEntriesChange($event)"
    (addClick)="openForm()">
  </app-generic-table>
</div>

<ng-template #portfolioActions let-item>
  <div class="d-flex flex-column gap-3">
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button
        type="button"
        class="btn btn-sm"
        [class.btn-outline-success]="!item.isPublished"
        [class.btn-outline-secondary]="item.isPublished"
        (click)="togglePublished(item)">
        {{ item.isPublished ? 'Unpublish' : 'Publish' }}
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="deletePortfolio(item)">
        Delete
      </button>
      <span class="text-muted small">{{ imageCount(item) }} gallery image(s)</span>
    </div>

    <div class="border-top pt-2">
      <label class="form-label fw-semibold small mb-2">Upload gallery image</label>
      <div class="d-flex flex-wrap align-items-end gap-2">
        <input
          type="file"
          class="form-control form-control-sm"
          style="max-width: 14rem"
          accept="image/*"
          (change)="onUploadFileSelected(item, $event)" />
        <input
          type="text"
          class="form-control form-control-sm"
          style="max-width: 12rem"
          placeholder="Alt text (optional)"
          [(ngModel)]="uploadAltText[item.id]" />
        <button
          type="button"
          class="btn btn-sm btn-primary"
          [disabled]="uploadingId === item.id"
          (click)="uploadImage(item)">
          Upload
        </button>
      </div>
    </div>
  </div>
</ng-template>
