<app-page-header
  [title]="'Projects'"
  [title1]="['Admin', 'Projects']"
  [activeitem]="'Projects'">
</app-page-header>

<div class="card custom-card">
  <div class="card-body">
    <app-generic-table
      [title]="'All Projects'"
      [columns]="columns"
      [data]="data"
      [page]="page"
      [entries]="entries"
      [totalItems]="totalItems"
      [totalPages]="totalPages"
      [searchCriteria]="searchCriteria"
      [labels]="labels"
      [dropdownOptions]="dropdownOptions"
      [showFilters]="true"
      [showPagination]="true"
      [showEmployeeFilter]="false"
      [showExportExcel]="false"
      [showAddButton]="false"
      [rowClickable]="true"
      [onSearch]="onSearch"
      (pageChange)="onPageChange($event)"
      (entriesChange)="onEntriesChange($event)"
      (rowClick)="onRowClick($event)">
    </app-generic-table>
  </div>
</div>
