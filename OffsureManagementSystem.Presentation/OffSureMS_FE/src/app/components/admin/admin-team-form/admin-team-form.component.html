<app-page-header></app-page-header>

<div class="card custom-card mb-3">
  <div class="card-body">
    <app-generic-form
      [title]="'New Team Member'"
      [formGroup]="formGroup"
      [formConfig]="formConfig"
      [showSubmit]="false">
    </app-generic-form>
  </div>
</div>

<div class="card custom-card mb-3">
  <div class="card-header border-bottom-0">
    <h5 class="mb-0">Skills</h5>
    <span class="fs-12 text-muted d-block mt-1">Select skills for this member and set proficiency (1–5) and years of experience.</span>
  </div>
  <div class="card-body pt-0">
    <app-team-member-skills-editor mode="draft" (assignmentsChange)="onSkillsChange($event)" />
  </div>
</div>

<div class="d-flex justify-content-end mb-4">
  <button type="button" class="btn btn-primary px-4" (click)="onSubmit()">Save Member</button>
</div>
