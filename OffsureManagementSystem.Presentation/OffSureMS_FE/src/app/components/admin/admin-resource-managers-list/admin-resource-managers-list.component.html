<app-page-header></app-page-header>

<div class="card custom-card">
  <app-generic-table
    [columns]="columns"
    [data]="data"
    [page]="page"
    [entries]="entries"
    [totalItems]="totalItems"
    [totalPages]="totalPages"
    [searchCriteria]="searchCriteria"
    [labels]="labels"
    [dropdownOptions]="dropdownOptions"
    [showFilters]="true"
    [showPagination]="true"
    [showSearch]="false"
    [showEmployeeFilter]="false"
    [showExportExcel]="false"
    [showAddButton]="true"
    [addButtonLabel]="'Add resource manager'"
    [expandable]="true"
    [expandTemplate]="managerDetail"
    [onSearch]="onSearch"
    (pageChange)="onPageChange($event)"
    (entriesChange)="onEntriesChange($event)"
    (addClick)="onAdd()">
  </app-generic-table>
</div>

<ng-template #managerDetail let-item>
  <app-admin-resource-manager-panel
    [managerId]="item.id"
    (saved)="onManagerSaved()"
    (deleted)="onManagerDeleted()" />
</ng-template>
