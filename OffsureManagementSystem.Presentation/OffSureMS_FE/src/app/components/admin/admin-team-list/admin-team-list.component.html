<app-page-header
  [title]="'Team'"
  [title1]="['Admin', 'Team']"
  [activeitem]="'Team'">
</app-page-header>

<div class="card custom-card">
    <app-generic-table
      [columns]="columns"
      [data]="data"
      [page]="page"
      [entries]="entries"
      [totalItems]="totalItems"
      [totalPages]="totalPages"
      [searchCriteria]="searchCriteria"
      [showFilters]="true"
      [showPagination]="true"
      [showEmployeeFilter]="false"
      [showExportExcel]="false"
      [showAddButton]="true"
      [addButtonLabel]="'Add Member'"
      [onSearch]="onSearch"
      (pageChange)="onPageChange($event)"
      (entriesChange)="onEntriesChange($event)"
      (addClick)="onAdd()">
    </app-generic-table>
</div>
