<app-page-header
  [title]="'New Service Request'"
  [title1]="['Client', 'Requests', 'New']"
  [activeitem]="'New Request'">
</app-page-header>

<div class="card custom-card">
  <div class="card-body">
    @if (formConfig.length) {
      <app-generic-form
        [title]="'New Service Request'"
        [formGroup]="formGroup"
        [formConfig]="formConfig"
        [submitLabel]="'Submit Request'"
        (formSubmit)="onSubmit()">
      </app-generic-form>
    } @else {
      <div class="text-muted py-4">Loading form...</div>
    }
  </div>
</div>
