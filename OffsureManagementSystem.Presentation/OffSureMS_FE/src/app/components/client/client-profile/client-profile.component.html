<app-page-header></app-page-header>

@if (loading) {
  <div class="text-center py-5 text-muted">Loading profile...</div>
} @else if (!profile) {
  <div class="alert alert-warning">Profile not found.</div>
} @else {
  <div class="account-profile">
    <section class="card custom-card profile-header-card mb-4">
      <div class="profile-header-cover"></div>
      <div class="profile-header-body">
        <div class="profile-header-main">
          <span class="profile-avatar-readonly">{{ initials }}</span>
          <div class="profile-header-info">
            <h2 class="profile-header-name mb-1">{{ profile.companyName }}</h2>
            <p class="profile-header-title mb-2">{{ profile.email }}</p>
            <div class="profile-header-meta">
              <span
                class="badge"
                [class.bg-success-transparent]="profile.isActive"
                [class.bg-danger-transparent]="!profile.isActive">
                {{ profile.isActive ? 'Active account' : 'Inactive account' }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card custom-card profile-tabs-card">
      <ul ngbNav #profileNav="ngbNav" [(activeId)]="activeTab" class="nav profile-tabs">
        <li [ngbNavItem]="'company'">
          <a ngbNavLink class="nav-link">Company details</a>
          <ng-template ngbNavContent>
            <div class="profile-tab-content">
              <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Company name</label>
                    <input type="text" class="form-control" formControlName="companyName" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Contact phone</label>
                    <input type="text" class="form-control" formControlName="contactPersonPhone" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" formControlName="city" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-control" formControlName="country" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Postal code</label>
                    <input type="text" class="form-control" formControlName="postalCode" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" formControlName="companyAddress" />
                  </div>
                </div>
                <div class="profile-form-actions">
                  <button type="submit" class="btn btn-primary btn-sm px-4" [disabled]="saving">
                    {{ saving ? 'Saving...' : 'Save changes' }}
                  </button>
                </div>
              </form>

              <app-change-password-card [embedded]="true"></app-change-password-card>
            </div>
          </ng-template>
        </li>
      </ul>

      <div class="profile-tabs__outlet" [ngbNavOutlet]="profileNav"></div>
    </section>
  </div>
}
