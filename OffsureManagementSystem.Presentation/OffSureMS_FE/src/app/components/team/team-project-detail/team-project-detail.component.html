<app-page-header></app-page-header>

@if (loading) {
  <div class="text-center py-5 text-muted">Loading project...</div>
} @else if (!project) {
  <div class="alert alert-warning">Project not found or you are not assigned.</div>
} @else {
  <app-project-detail-readonly
    [project]="project"
    audience="team"
    [myRole]="myRole"
    [highlightMemberId]="teamMemberId"
    [showLogTimeButton]="isHourlyProject"
    [timesheetHistoryLink]="isHourlyProject ? ['/team', 'projects', project.id, 'timesheet-report'] : null"
    [statusBadgeClassFn]="statusBadgeClassFn"
    [statusLabelFn]="statusLabelFn"
    (logTimeClick)="openLogTimePage()" />
}
