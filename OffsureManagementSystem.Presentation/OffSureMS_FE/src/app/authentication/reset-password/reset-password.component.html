<div class="reset-container">
  <div class="reset-card">

    <!-- Left -->
    <div class="reset-brand-section">
      <div class="brand-content">
        <a routerLink="/landing-page" class="brand-logo-link mb-4" aria-label="Go to landing page">
          <img src="assets/images/offshore1.png" alt="Offshore TechX" class="brand-logo-image" />
        </a>

        <p class="brand-subtitle">
          Create a strong new password
        </p>
      </div>
    </div>

    <!-- Right -->
    <div class="reset-form-section">
      <div class="form-container">

        <div class="form-header mb-4">
          <h2 class="form-title">
            New Password
          </h2>

          <p class="form-subtitle">
            Enter your new password below
          </p>
        </div>

        <form
          [formGroup]="form"
          (ngSubmit)="submit()">

          <!-- Password -->
          <div class="form-group mb-3">
            <label class="form-label">
              New Password
            </label>

            <div class="input-wrapper">
              <i class="fe fe-lock"></i>

              <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                class="form-control"
                placeholder="Enter new password">

              <button
                type="button"
                class="toggle-password"
                (click)="togglePassword()">

                <i
                  class="fe"
                  [class.fe-eye]="!showPassword"
                  [class.fe-eye-off]="showPassword">
                </i>
              </button>
            </div>
          </div>

          <!-- Confirm -->
          <div class="form-group mb-3">
            <label class="form-label">
              Confirm Password
            </label>

            <div class="input-wrapper">
              <i class="fe fe-lock"></i>

              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                formControlName="confirmPassword"
                class="form-control"
                placeholder="Confirm password">

              <button
                type="button"
                class="toggle-password"
                (click)="toggleConfirmPassword()">

                <i
                  class="fe"
                  [class.fe-eye]="!showConfirmPassword"
                  [class.fe-eye-off]="showConfirmPassword">
                </i>
              </button>
            </div>

            <div
              class="invalid-feedback"
              *ngIf="passwordsMismatch">

              Passwords do not match
            </div>
          </div>

          <button
            class="btn btn-reset w-100 mt-4"
            type="submit"
            [disabled]="isLoading">

            <span *ngIf="!isLoading">
              Reset Password
            </span>

            <span *ngIf="isLoading">
              <span class="spinner-border spinner-border-sm me-2"></span>
              Resetting...
            </span>
          </button>
        </form>

      </div>
    </div>

  </div>
</div>
