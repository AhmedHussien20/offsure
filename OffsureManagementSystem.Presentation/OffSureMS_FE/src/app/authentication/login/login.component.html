<div class="login-container">
  <!-- Left side - Branding -->
  <div class="login-brand-section">
    <div class="brand-content">
      <div class="brand-logo mb-4">
        <i class="fe fe-anchor"></i>
      </div>
      <h1 class="brand-title">OffShore Management</h1>
      <p class="brand-subtitle">Streamline your offshore operations</p>
      <div class="brand-features mt-5">
        <div class="feature">
          <i class="fe fe-check-circle"></i>
          <span>Secure & Reliable</span>
        </div>
        <div class="feature">
          <i class="fe fe-check-circle"></i>
          <span>Real-time Monitoring</span>
        </div>
        <div class="feature">
          <i class="fe fe-check-circle"></i>
          <span>24/7 Support</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right side - Login Form -->
  <div class="login-form-section">
    <div class="form-container">
      <div class="form-header mb-4">
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-subtitle">Sign in to your account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="submit($event)">
        <!-- Email -->
        <div class="form-group mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <i class="fe fe-mail"></i>
            <input
              type="email"
              formControlName="email"
              class="form-control"
              [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              placeholder="your@email.com"
              autocomplete="email">
          </div>
          <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['required'] && loginForm.get('email')?.touched">
            Email is required
          </div>
          <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['email'] && loginForm.get('email')?.touched">
            Please enter a valid email
          </div>
        </div>

        <!-- Password -->
        <div class="form-group mb-2">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label">Password</label>
            <a routerLink="/auth/forgot-password" class="forgot-link">Forgot?</a>
          </div>
          <div class="input-wrapper password-wrapper">
            <i class="fe fe-lock"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="form-control"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              placeholder="Enter your password"
              autocomplete="current-password">
            <button type="button" class="toggle-password" (click)="toggleVisibility()" aria-label="Toggle password visibility">
              <i class="fe" [class.fe-eye]="!showPassword" [class.fe-eye-off]="showPassword"></i>
            </button>
          </div>
          <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched">
            Password is required
          </div>
          <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['minlength'] && loginForm.get('password')?.touched">
            Password must be at least 6 characters
          </div>
        </div>

        <!-- Submit Button -->
        <button
          class="btn btn-login w-100 mt-4"
          type="submit"
          [disabled]="loginForm.invalid || authservice.showLoader">
          <span *ngIf="!authservice.showLoader">Sign In</span>
          <span *ngIf="authservice.showLoader">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Signing in...
          </span>
        </button>
      </form>

      <!-- Register Link -->
      <div class="register-link mt-4 text-center">
        <span>Don't have an account? </span>
        <a routerLink="/auth/register" class="register-link-text">Create one</a>
      </div>
    </div>
  </div>
</div>
